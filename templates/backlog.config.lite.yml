# Backlog.md 配置片段（轻量模式）
#
# 用法：把下面内容**合并**进项目里的 backlog/config.yml。

# 轻量模式 DoD：3 项（砍掉「五轴审查」与「反证」）
definition_of_done:
  - 测试通过且无回归
  - 所有验收断言已逐条 --check-ac 标记完成
  - 决定与文档已更新（backlog decision / docs）

# 单人单分支：无需跨分支状态检查
check_active_branches: false

# 没有配置远端时保持 false，避免每次操作都提示
remote_operations: false

auto_commit: true
