# Backlog.md 轻量模式配置（小型项目）
# 使用方式：复制为项目根目录的 backlog.config.yml 后按需微调

backlog_directory: backlog

# 任务 ID 前缀
task_prefix: TASK

zeroPaddedIds: false

# 轻量模式 DoD：精简为 3 项（砍掉"五轴审查通过"与"关键检查已做反证"）
definition_of_done:
  - 测试通过且无回归
  - 所有验收断言已逐条 --check-ac 标记完成
  - 决定与文档已更新（backlog decision / docs）

# 轻量模式：单人、单分支，无需跨分支状态检查
checkActiveBranches: false
autoCommit: true
