# Backlog.md 配置片段（完整模式）
#
# 用法：把下面内容**合并**进项目里的 backlog/config.yml，
#      不是覆盖、也不是放到仓库根目录。
# 已有 backlog/config.yml 时只补缺失的键；其余键保持 backlog init 生成的值。

# 完成定义（Definition of Done）：每个新建任务自动带上的完成项
# 这是质量门禁在 Backlog.md 里的落地载体
definition_of_done:
  - 测试通过且无回归
  - 所有验收断言已逐条 --check-ac 标记完成
  - 五轴审查通过（正确性/设计/安全/测试/体验）
  - 决定与文档已更新（backlog decision / docs）
  - 关键检查已做反证

# 状态机：Blocked 不是默认状态，需要显式声明才能使用
statuses: ["To Do", "In Progress", "Blocked", "Done"]

# 门禁标签：承载 needs-review → reviewed 等流转
labels: ["needs-review", "reviewed", "needs-test", "tested", "blocked"]

# 复杂项目建议开启，保证跨分支状态准确
check_active_branches: true
remote_operations: true
auto_commit: true
